apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Release.Name }}-postgres
  labels:
    app: {{ .Release.Name }}-postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  stopDelay: {{ .Values.postgres.stopDelay }}
  smartShutdownTimeout: {{ .Values.postgres.smartShutdownTimeout }}
  env:
    {{- toYaml .Values.postgres.env | nindent 4 }}
  probes:
    {{- toYaml .Values.postgres.probes | nindent 4 }}
  imageName: {{ .Values.postgres.image | quote }}
  {{- if .Values.priorities.enabled }}
  priorityClassName: {{ .Release.Name }}-critical
  {{- end }}
  enablePDB: {{ .Values.pdb.enabled }}
  instances: {{ .Values.postgres.instances }}
  inheritedMetadata:
    labels:
      app: {{ .Release.Name }}-postgres
      app.kubernetes.io/name: postgres
      app.kubernetes.io/instance: {{ .Release.Name }}
  bootstrap:
    initdb:
      database: {{ .Values.postgres.database }}
      owner: {{ .Values.postgres.owner }}
  storage:
    size: {{ .Values.postgres.storage.size }}
    storageClass: {{ .Values.postgres.storage.storageClass }}
  resources:
    {{- toYaml .Values.postgres.resources | nindent 4 }}
