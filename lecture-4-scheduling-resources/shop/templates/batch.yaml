apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-batch
  labels:
    app: {{ .Release.Name }}-batch
spec:
  replicas: {{ .Values.batch.replicas }}
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: {{ .Release.Name }}-batch
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-batch
        app.kubernetes.io/name: batch
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 1
      {{- with .Values.batch.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: batch
          image: {{ .Values.batch.image | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: MEMORY_MIB
              value: {{ .Values.batch.memoryMiB | quote }}
            - name: CPU_DUTY
              value: {{ .Values.batch.cpuDuty | quote }}
            - name: ALLOCATION_DELAY
              value: {{ .Values.batch.allocationDelay | quote }}
          resources:
            {{- toYaml .Values.batch.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
