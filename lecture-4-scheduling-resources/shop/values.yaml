api:
  replicas: 2
  image:
    repository: docker.io/library/shop
    tag: "1.1.0"
    pullPolicy: IfNotPresent
  healthFail: false
  service:
    type: NodePort
    port: 8000
    nodePort: 30080
  resources:
    requests:
      cpu: 486m
      memory: 131Mi
    limits:
      cpu: 486m
      memory: 131Mi

worker:
  replicas: 2
  image:
    repository: docker.io/library/shop
    tag: "1.1.1"
    pullPolicy: IfNotPresent
  healthFail: false
  service:
    type: ClusterIP
    port: 8000
  resources:
    requests:
      cpu: 217m
      memory: 100Mi
    limits:
      cpu: 250m
      memory: 128Mi

monitoring:
  enabled: true
  namespace: monitoring
  interval: 15s
  scrapeTimeout: 5s
  alertFor: 30s

rollout:
  maxSurge: 1
  maxUnavailable: 0
  minReadySeconds: 5
  progressDeadlineSeconds: 300

postgres:
  stopDelay: 30
  smartShutdownTimeout: 10
  env:
    - name: GOMAXPROCS
      value: "1"
  probes:
    startup:
      periodSeconds: 5
      timeoutSeconds: 10
      failureThreshold: 60
    liveness:
      timeoutSeconds: 10
      failureThreshold: 6
    readiness:
      timeoutSeconds: 10
  image: ghcr.io/cloudnative-pg/postgresql:17.7
  instances: 1
  database: shop
  owner: shop
  storage:
    size: 1Gi
    storageClass: standard
  resources:
    requests:
      cpu: 870m
      memory: 212Mi
    limits:
      cpu: 870m
      memory: 212Mi

placement:
  # topologySpreadConstraints or podAntiAffinity
  mechanism: topologySpreadConstraints
  enabled: true
  topologyKey: kubernetes.io/hostname

batch:
  replicas: 1
  image: docker.io/library/shop-batch:4.0.0
  memoryMiB: 64
  cpuDuty: "0.1"
  allocationDelay: "0.02"
  nodeSelector: {}
  resources:
    requests:
      cpu: 100m
      memory: 96Mi
    limits:
      cpu: 500m
      memory: 512Mi

priorities:
  enabled: true
  critical: 100000
  batch: -1000
pdb:
  enabled: true
  apiMinAvailable: 1
