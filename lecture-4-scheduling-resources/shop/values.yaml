api:
  replicas: 2
  image:
    repository: docker.io/library/shop
    tag: "1.1.0"
    pullPolicy: IfNotPresent
  healthFail: false
  service:
    type: NodePort
    port: 8000
    nodePort: 30080
  resources:
    requests:
      cpu: 61m
      memory: 100Mi
    limits:
      cpu: 500m
      memory: 128Mi

worker:
  replicas: 2
  image:
    repository: docker.io/library/shop
    tag: "1.1.1"
    pullPolicy: IfNotPresent
  healthFail: false
  service:
    type: ClusterIP
    port: 8000
  resources:
    requests:
      cpu: 46m
      memory: 100Mi
    limits:
      cpu: 250m
      memory: 128Mi

monitoring:
  enabled: true
  namespace: monitoring
  interval: 15s
  scrapeTimeout: 5s
  alertFor: 30s

rollout:
  maxSurge: 1
  maxUnavailable: 0
  minReadySeconds: 5
  progressDeadlineSeconds: 60

postgres:
  image: ghcr.io/cloudnative-pg/postgresql:17.7
  instances: 1
  database: shop
  owner: shop
  storage:
    size: 1Gi
    storageClass: standard
  resources:
    requests:
      cpu: 156m
      memory: 100Mi
    limits:
      cpu: "1"
      memory: 512Mi

placement:
  # topologySpreadConstraints or podAntiAffinity
  mechanism: topologySpreadConstraints
  enabled: true
  topologyKey: kubernetes.io/hostname

batch:
  replicas: 1
  image: docker.io/library/shop-batch:4.0.0
  memoryMiB: 64
  cpuDuty: "0.1"
  allocationDelay: "0.02"
  nodeSelector: {}
  resources:
    requests:
      cpu: 100m
      memory: 96Mi
    limits:
      cpu: 500m
      memory: 512Mi

priorities:
  enabled: false
  critical: 100000
  batch: -1000
pdb:
  enabled: false
  apiMinAvailable: 1
