# One collector per eligible node; files are local to that node.
controller:
  type: daemonset

alloy:
  mounts:
    varlog: true
  extraEnv:
    - name: NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
  configMap:
    content: |
      discovery.kubernetes "pods" {
        role = "pod"
        namespaces {
          names = ["default"]
        }
        // Each agent discovers only pods whose files exist on its node.
        selectors {
          role = "pod"
          field = "spec.nodeName=" + sys.env("NODE_NAME")
          label = "app=api"
        }
      }

      discovery.relabel "logs" {
        targets = discovery.kubernetes.pods.targets
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app"]
          target_label = "app"
        }
        // CRI files: /var/log/pods/<namespace>_<name>_<uid>/<container>/*.log
        rule {
          source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
          separator = "/"
          target_label = "__path__"
          replacement = "/var/log/pods/*$1/*.log"
        }
      }

      local.file_match "pods" {
        path_targets = discovery.relabel.logs.output
      }

      loki.source.file "pods" {
        targets = local.file_match.pods.targets
        forward_to = [loki.process.pods.receiver]
      }

      loki.process "pods" {
        // Strip the runtime's timestamp/stream/flags envelope, not the app JSON.
        stage.cri {}
        forward_to = [loki.write.local.receiver]
      }

      loki.write "local" {
        endpoint {
          url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
        }
      }
# Для офлайн-переноса через kind используем локально доступный тег.
configReloader:
  image:
    tag: v0.94.2
    digest: ""
    pullPolicy: IfNotPresent
