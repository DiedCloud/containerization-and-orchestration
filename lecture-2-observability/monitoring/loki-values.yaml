# Loki as a single binary. Loki itself is just a store + query API: it never
# goes to the pods to fetch anything, something must push logs into it.
deploymentMode: SingleBinary

loki:
  # No multi-tenancy: one tenant for the whole lab. Removes the need for
  # X-Scope-OrgID on every push/query.
  auth_enabled: false
  commonConfig:
    # One instance => nothing to replicate the chunks against.
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

singleBinary:
  replicas: 1
  # Loki must write somewhere: the container root FS is read-only, and chunks,
  # the TSDB index and ruler state all land in /var/loki. Without a volume the
  # pod dies with "mkdir /var/loki: read-only file system".
  persistence:
    enabled: true
    size: 2Gi

# The chart defaults to SimpleScalable; these three hold the scalable-mode
# microservices that we do not want at all in single-binary mode.
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

# Extra moving parts a one-node lab gets nothing from.
lokiCanary:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
# With the gateway off, the `loki` Service exposes 3100 directly instead of
# hiding it behind an nginx pod.
gateway:
  enabled: false
# The chart's helm-test asserts on the canary, so with the canary off the test
# has to go too (otherwise the render fails validation).
test:
  enabled: false
