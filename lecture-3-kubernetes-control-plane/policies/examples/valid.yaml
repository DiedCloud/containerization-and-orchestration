apiVersion: v1
kind: Pod
metadata:
  name: guardrail-valid
  namespace: shop
  labels:
    app: policy-check
spec:
  restartPolicy: Never
  containers:
    - name: app
      image: docker.io/library/shop:1.0.0
      imagePullPolicy: IfNotPresent
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 128Mi
      securityContext:
        privileged: false
