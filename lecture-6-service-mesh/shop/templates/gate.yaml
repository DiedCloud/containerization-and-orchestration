{{- if .Values.gate.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata: {name: shop-gate}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: shop-gate}
rules:
- apiGroups: [policy.linkerd.io]
  resources: [httproutes]
  resourceNames: [shop-api]
  verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: shop-gate}
subjects:
- {kind: ServiceAccount, name: shop-gate}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: shop-gate}
---
apiVersion: batch/v1
kind: Job
metadata: {name: shop-gate}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels: {app: shop-gate}
    spec:
      serviceAccountName: shop-gate
      restartPolicy: Never
      nodeSelector: {{ toJson .Values.nodeSelector }}
      containers:
      - name: gate
        image: {{ .Values.gate.image }}
        env:
        - {name: NAMESPACE, value: {{ .Release.Namespace }}}
        resources:
          requests: {cpu: 10m, memory: 24Mi}
          limits: {cpu: 100m, memory: 64Mi}
        securityContext: {runAsNonRoot: true, runAsUser: 10001, allowPrivilegeEscalation: false}
{{- end }}
