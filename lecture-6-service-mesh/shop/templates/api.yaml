{{- range $version := list "v1" "v2" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: shop-api-{{ $version }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-api-{{ $version }}
  labels: {app: shop-api, app.kubernetes.io/instance: shop}
spec:
  replicas: {{ (index $.Values.api $version).replicas }}
  selector:
    matchLabels: {app: shop-api, version: {{ $version }}}
  template:
    metadata:
      labels: {app: shop-api, version: {{ $version }}, deployment: shop-api-{{ $version }}, app.kubernetes.io/instance: shop}
      annotations:
        {{- if $.Values.mesh.enabled }}
        {{- toYaml $.Values.mesh.annotations | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: shop-api-{{ $version }}
      nodeSelector: {{ toJson $.Values.nodeSelector }}
      containers:
      - name: api
        image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag }}"
        imagePullPolicy: {{ $.Values.image.pullPolicy }}
        ports: [{name: http, containerPort: 8000}]
        env:
        - {name: VERSION, value: {{ $version | quote }}}
        - {name: FAIL, value: {{ $.Values.api.v2.fail | quote }}}
        - {name: FLAKY, value: {{ $.Values.api.v1.flaky | quote }}}
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef: {name: shop-postgres-app, key: uri}
        resources: {{ toJson $.Values.api.resources }}
        readinessProbe:
          httpGet: {path: /health, port: http}
        livenessProbe:
          httpGet: {path: /health, port: http}
        securityContext: {runAsNonRoot: true, runAsUser: 10001, allowPrivilegeEscalation: false}
---
apiVersion: v1
kind: Service
metadata:
  name: shop-api-{{ $version }}
  labels: {app: shop-api, version: {{ $version }}, mesh-metrics: "true"}
spec:
  selector: {app: shop-api, version: {{ $version }}}
  ports:
  - {name: http, port: 8000, targetPort: http}
  - {name: proxy-metrics, port: 4191, targetPort: 4191}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: shop-api
spec:
  selector: {app: shop-api, version: v1}
  ports: [{name: http, port: 8000, targetPort: http}]
