{{- if .Values.mesh.enabled }}
apiVersion: policy.linkerd.io/v1beta3
kind: Server
metadata: {name: shop-api}
spec:
  podSelector:
    matchLabels: {app: shop-api}
  port: 8000
  proxyProtocol: HTTP/1
---
apiVersion: policy.linkerd.io/v1alpha1
kind: MeshTLSAuthentication
metadata: {name: shop-clients}
spec:
  identities:
  - "*.shop6.serviceaccount.identity.linkerd.cluster.local"
---
apiVersion: policy.linkerd.io/v1alpha1
kind: AuthorizationPolicy
metadata: {name: shop-api}
spec:
  targetRef: {group: policy.linkerd.io, kind: Server, name: shop-api}
  requiredAuthenticationRefs:
  - {group: policy.linkerd.io, kind: MeshTLSAuthentication, name: shop-clients}
{{- end }}
