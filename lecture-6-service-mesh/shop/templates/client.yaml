apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-client
  labels: {app: shop-client}
spec:
  replicas: 1
  selector:
    matchLabels: {app: shop-client}
  template:
    metadata:
      labels: {app: shop-client, deployment: shop-client}
      annotations:
        {{- if .Values.mesh.enabled }}
        {{- toYaml .Values.mesh.annotations | nindent 8 }}
        {{- end }}
    spec:
      nodeSelector: {{ toJson .Values.nodeSelector }}
      containers:
      - name: client
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        command: [python, -c, "import time; time.sleep(1000000)"]
        resources:
          requests: {cpu: 20m, memory: 32Mi}
          limits: {cpu: 500m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: shop-client
  labels: {mesh-metrics: "true"}
spec:
  selector: {app: shop-client}
  ports: [{name: proxy-metrics, port: 4191, targetPort: 4191}]
